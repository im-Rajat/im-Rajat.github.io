site_name: Rajat's Notes
site_url: https://im-rajat.github.io/Notes/

theme:
  name: material
  features:
    - navigation.tabs         # Adds a top navigation bar for better organization
    - navigation.sections     # Groups items under bold headers on the left
    - navigation.top          # Adds a "Back to top" button on long pages
    - navigation.instant      # Prevents full page reloads
    - navigation.indexes      # Allows folders to act as clickable pages
    # - navigation.tracking     # Updates the URL hash as you scroll
    - search.suggest          # Provides search suggestions as you type
    - search.highlight        # Highlights search terms in the results
    - content.code.copy       # Critical for your C++/Java notes
    # - toc.integrate           # Shows the table of contents in the sidebar
  
  # Adds a Light/Dark mode toggle (Developers expect this)
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: 'docs'

# Sources for the two generated pages: each build.py turns them into the JSON its index.html loads,
# so they shouldn't become pages. Excluding the folder's *.md also stops a README there from
# replacing that folder's index.html.
exclude_docs: |
  AI/Prompts/*.md
  AI/Prompts/categories/
  AI/Prompts/build.py
  Resources/Websites/*.md
  Resources/Websites/build.py

plugins:
  - search                    # Must be listed explicitly once a plugins section exists
  - redirects:                # Keeps old URLs working after folders moved into categories
      redirect_maps:
        'C/README.md': 'Programming/C/README.md'
        'CPP/README.md': 'Programming/CPP/README.md'
        'Java/README.md': 'Programming/Java/README.md'
        'Python/README.md': 'Programming/Python/README.md'
        'Django/README.md': 'Programming/Django/README.md'
        'SQL/README.md': 'Programming/SQL/README.md'
        'SOLID-Principles/README.md': 'Software-Design/SOLID-Principles/README.md'
        'SOLID-Principles/01_Introduction/README.md': 'Software-Design/SOLID-Principles/01_Introduction/README.md'
        'SOLID-Principles/02_Single_Responsibility/README.md': 'Software-Design/SOLID-Principles/02_Single_Responsibility/README.md'
        'SOLID-Principles/03_Open_Close/README.md': 'Software-Design/SOLID-Principles/03_Open_Close/README.md'
        'SOLID-Principles/04_Liskov_Substitution/README.md': 'Software-Design/SOLID-Principles/04_Liskov_Substitution/README.md'
        'SOLID-Principles/05_Interface_Segregation/README.md': 'Software-Design/SOLID-Principles/05_Interface_Segregation/README.md'
        'SOLID-Principles/06_Dependency_Inversion/README.md': 'Software-Design/SOLID-Principles/06_Dependency_Inversion/README.md'
        'Design-Patterns/README.md': 'Software-Design/Design-Patterns/README.md'
        'Design-Patterns/Creational-Design-Patterns/Singleton/README.md': 'Software-Design/Design-Patterns/Creational-Design-Patterns/Singleton/README.md'
        'System-Design/README.md': 'Software-Design/System-Design/README.md'
        'System-Design/01_Basics/README.md': 'Software-Design/System-Design/01_Basics/README.md'
        'System-Design/System-Design-For-Beginners.md': 'Software-Design/System-Design/System-Design-For-Beginners.md'
        'System-Design/index_.md': 'Software-Design/System-Design/index_.md'
        'Git/README.md': 'DevOps/Git/README.md'
        'Github-Actions/README.md': 'DevOps/Github-Actions/README.md'
        'Docker/README.md': 'DevOps/Docker/README.md'
        'CICD/README.md': 'DevOps/CICD/README.md'
        'CICD/CICD-Basics/README.md': 'DevOps/CICD/CICD-Basics/README.md'
        'Linux/README.md': 'Systems/Linux/README.md'
        'Computer-Vision/README.md': 'AI/Computer-Vision/README.md'
        'Ethical-Hacking/README.md': 'Systems/Ethical-Hacking/README.md'
        'Share-Market/README.md': 'Wealth-and-Wisdom/Share-Market/README.md'
        'Personal-Notes/Life-Concepts-of-a-Programmer.md': 'Wealth-and-Wisdom/Life-Concepts-of-a-Programmer.md'
        'PDF/README.md': 'Resources/PDF/README.md'
        'Websites/README.md': 'https://im-rajat.github.io/Notes/Resources/Websites/'
        'Interviews/Interview-Questions/README.md': 'Interviews/README.md'
        'Interviews/Interview-Questions/Operating-Systems/README.md': 'Systems/Operating-Systems/README.md'
        'Interviews/Interview-Questions/Computer-Networks/README.md': 'Systems/Computer-Networks/README.md'
        'Interviews/Interview-Questions/DBMS/README.md': 'Systems/DBMS/README.md'
        'Interviews/Interview-Questions/System-Design/README.md': 'Software-Design/System-Design/README.md'
        'Interviews/Interview-Questions/C-CPP/README.md': 'Programming/README.md'
        'AI/Prompts/Personal-Prompts.md': 'https://im-rajat.github.io/Notes/AI/Prompts/'
        'AI/Prompts/Library/index.md': 'https://im-rajat.github.io/Notes/AI/Prompts/'

markdown_extensions:
  - tables                    # Enables GitHub-style tables
  - sane_lists                # Fixes common list formatting issues
  - admonition                # Adds support for note/warning/info blocks
  - attr_list                 # Allows you to resize images directly in markdown: ![img](file.png){ width="300" }
  - md_in_html                # Allows markdown to work inside raw HTML tags
  - pymdownx.details          # Creates collapsible dropdown sections
  - pymdownx.superfences      # Required for complex code blocks
  - pymdownx.inlinehilite     # Allows syntax highlighting on single inline words
  - pymdownx.tasklist:        # Checkboxes for to-do lists
      custom_checkbox: true
  - pymdownx.highlight:       # The actual syntax highlighting engine
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.arithmatex:      # Renders complex math and Big-O notation
      generic: true
  - pymdownx.superfences:     # Custom code block for Mermaid diagrams
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
