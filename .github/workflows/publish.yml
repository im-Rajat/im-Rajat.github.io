name: publish
on:
  push:
    branches:
      - main 

# Strict permissions required for artifact deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents multiple pipelines from trying to deploy at the exact same time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history, so each page's "Last update" date comes from its own last commit

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
            
      - run: pip install mkdocs-material mkdocs-redirects mkdocs-git-revision-date-localized-plugin

      # Retaining our folder hack to keep the root directory clean.
      # docs/ is a git worktree (a second checkout sharing this repo's history) rather than a plain copy,
      # so the git-revision-date plugin can still look up each page's commits.
      # The portfolio, College-Projects and Resume are published at the site root, so they stay out of the notes build.
      - name: Hack to fix the folder structure dynamically
        run: |
          git worktree add --detach docs
          rm -rf docs/.github docs/mkdocs.yml docs/index.html docs/College-Projects docs/Resume

      # Turn the markdown sources of the Prompt Library and Useful Websites pages into the JSON they load
      - run: |
          python docs/AI/Prompts/build.py
          python docs/Resources/Websites/build.py

      # The notes go under /Notes/ (site_url in mkdocs.yml), the root pages go at /
      - run: mkdocs build --site-dir site/Notes

      - name: Add the site-root pages
        run: |
          cp -r index.html College-Projects Resume site/
          cp site/Notes/404.html site/404.html

      # Package the 'site/' folder into an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
