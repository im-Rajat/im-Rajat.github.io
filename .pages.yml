# Pages CMS config (https://pagescms.org): the add/edit/delete form for the Prompt Library.
# Open https://app.pagescms.org, sign in with GitHub, pick im-Rajat/Notes, then "Prompts".
# Each save is a commit to main, which triggers the publish workflow and updates the site.
content:
  - name: prompts
    label: Prompts
    type: collection
    path: AI/Prompts/Library/prompts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: title
      order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: personal
              label: Personal
            - name: work
              label: Work
            - name: learning
              label: Learning
            - name: image
              label: Image
      - name: tags
        label: Tags
        type: string
        list: true
        description: Short keywords that help search, e.g. email, writing
      - name: description
        label: Description
        type: string
        description: Optional one-liner shown under the title (when to use it, what to upload)
      - name: body
        label: Prompt
        type: text
        required: true
        description: The prompt itself. Put fill-in parts in [square brackets] and the site turns them into input boxes.
